[project]
name = "legal-ai-assistant"
version = "0.2.0"
description = "Production RAG platform over Australian legal Q&A"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Prompt prose is deliberately formatted for the LLM, not for humans at 100 cols.
"src/rag/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["rag"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["turbovec", "datasets"]
ignore_missing_imports = true