name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Unit tests
        run: pytest -q

      # ── Eval gate: retrieval quality on a cached index ──────────────────────
      # The vector index is an artifact, not source: cache it keyed on the
      # code that produces it. A cache hit skips the Gemini embedding calls
      # entirely; a miss rebuilds (needs GEMINI_API_KEY secret).
      - name: Restore index cache
        id: index-cache
        uses: actions/cache@v4
        with:
          path: |
            aus_legal_qa.tv
            aus_legal_qa.faiss
            metadata.json
          key: index-${{ hashFiles('src/rag/chunker.py', 'src/rag/indexer.py', 'src/rag/vector_store.py', 'requirements.txt') }}

      - name: Build index (cache miss only)
        if: steps.index-cache.outputs.cache-hit != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m rag.indexer

      - name: Eval gate (retrieval + casual mode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RERANK_API_KEY: ${{ secrets.RERANK_API_KEY }}
        run: python -m evals.run_eval --ci
