name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # download LFS files (index artifacts) at checkout

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Unit tests
        run: pytest -q

      # ── Eval gate ────────────────────────────────────────────────────────────
      # Index files (aus_legal_qa.tv, aus_legal_qa.faiss, metadata.json) are
      # stored in Git LFS and downloaded automatically by the checkout step
      # above. The rebuild step below is skipped by default (skip-rebuild=true)
      # but can be forced by setting the FORCE_REBUILD secret/variable to 'true'
      # when you want to regenerate the index in CI (e.g. after a chunker change
      # that you haven't rebuilt locally yet).
      - name: Rebuild index (forced only)
        if: vars.FORCE_REBUILD == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python -m rag.indexer

      - name: Eval gate (retrieval + casual mode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RERANK_API_KEY: ${{ secrets.RERANK_API_KEY }}
          EVAL_JUDGE_API_KEY: ${{ secrets.EVAL_JUDGE_API_KEY }}
          EVAL_JUDGE_BASE_URL: ${{ secrets.EVAL_JUDGE_BASE_URL }}
          EVAL_JUDGE_MODEL: ${{ secrets.EVAL_JUDGE_MODEL }}
        run: python -m evals.run_eval --ci
